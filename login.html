<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LogiTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color-main: #f4f7fe;
            --bg-color-surface: #ffffff;
            --text-primary: #2b3674;
            --text-secondary: #a3aed1;
            --accent-color: #4318ff;
            --accent-hover: #3311db;
            --danger-color: #ee5d50;
            --border-color: #e2e8f0;
            --shadow-soft: 0px 4px 20px rgba(0, 0, 0, 0.05);
            --border-radius-lg: 16px;
            --border-radius-md: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color-main); color: var(--text-primary); display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }

        .login-container {
            background: var(--bg-color-surface);
            padding: 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-soft);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 30px;
        }

        .logo i { color: var(--accent-color); font-size: 32px; filter: drop-shadow(0 0 10px rgba(67, 24, 255, 0.3)); }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: var(--border-radius-md); font-family: inherit; font-size: 14px; transition: border-color 0.2s; }
        .form-control:focus { outline: none; border-color: var(--accent-color); }
        
        .btn { width: 100%; padding: 12px; border-radius: var(--border-radius-md); font-weight: 600; font-size: 16px; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; background-color: var(--accent-color); color: white; margin-top: 10px; }
        .btn:hover { background-color: var(--accent-hover); box-shadow: 0 4px 10px rgba(67, 24, 255, 0.2); }
        
        .error-msg { color: var(--danger-color); font-size: 13px; font-weight: 500; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fa-solid fa-truck-fast"></i>
            <span>LogiTrack</span>
        </div>
        <h2 style="font-size: 20px; margin-bottom: 20px;">Iniciar Sessão</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Utilizador</label>
                <input type="text" id="username" class="form-control" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Palavra-passe</label>
                <input type="password" id="password" class="form-control" placeholder="admin" required>
            </div>
            <button type="submit" class="btn">Entrar na Plataforma</button>
            <div id="errorMsg" class="error-msg">Credenciais inválidas. Tente admin / admin.</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'admin' && p === 'admin') {
                localStorage.setItem('logitrack_session', 'active');
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        // Prevents going back to login if already logged in
        if(localStorage.getItem('logitrack_session') === 'active') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
